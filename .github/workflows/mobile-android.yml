# Сборка Expo-версии (mobile/) в apk для Android — без аккаунта Expo.
# Готовый файл: вкладка Actions → последний запуск → Artifacts → viamia-android.
name: mobile-android
# запуск вручную: Actions → mobile-android → Run workflow (выбрать ветку)
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # anon-ключ публичный (доступ ограничивает RLS в базе); service_role сюда не класть
      EXPO_PUBLIC_SUPABASE_URL: https://wksvdvqxixyjguvbcqza.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indrc3ZkdnF4aXh5amd1dmJjcXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTQ4NTEsImV4cCI6MjExMDA3MDg1MX0.LtfdX8o50ubPspkAVk_61cdeUag9c4bOK6hm0yL7vSo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # shortcut: release подписан отладочным ключом — годится для теста на телефоне, для Google Play нужен свой ключ
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: viamia-android
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
